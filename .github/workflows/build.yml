name: Build PR (intentionally vulnerable)

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: [self-hosted, citadel]
    steps:
      # Citadel must be the very first step. In hand-off, the wrapper
      # action installs the agent + starts the policy engine.
      - name: Harden runner with Citadel
        uses: kiran-sec/citadel-action@v1
        with:
          # `audit` = alert-only (no nftables/DNS enforcement). Safe default
          # for the demo so we don't disturb the runner's existing
          # networking. Flip to `block` once the allowlist is proven.
          egress-policy: audit
          allowed-endpoints: |
            attacker.example

      # DELIBERATELY VULNERABLE: checking out the PR's *head* commit
      # under pull_request_target means we'll execute whatever code is
      # in the fork.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Build
        env:
          SECRET_TOKEN: ${{ secrets.SECRET_TOKEN }}
        run: |
          chmod +x ./build.sh
          ./build.sh
