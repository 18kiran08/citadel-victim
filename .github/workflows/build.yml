name: Build PR (intentionally vulnerable)

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  # Manual/demo: reruns/replays of PR runs keep the OLD workflow snapshot; use this to
  # execute the workflow file from default branch against a fork head ref.
  workflow_dispatch:
    inputs:
      pr_fork_repository:
        description: "Fork repo (owner/name) holding the attacker branch"
        required: false
        default: "18kiran08/citadel-victim"
      pr_head_ref:
        description: "Branch name or SHA on the fork to Checkout (simulate PR head)"
        required: false
        default: "attacker-base64-exfil"

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: [self-hosted, citadel]
    steps:
      # Citadel must be the very first step. In hand-off, the wrapper
      # action installs the agent + starts the policy engine.
      - name: Harden runner with Citadel
        uses: kiran-sec/citadel-action@v1
        with:
          # `block` turns on Citadel DNS allowlist + nft egress (see action/scripts/start.sh).
          # GitHub API/file CDN often land on different A records over time; `citadel-policy`
          # seeds a small pin list (140.82.x / 20.209.x) and adds any IP resolved for
          # allowlisted hostnames (github.com, objects.githubusercontent.com, …).
          egress-policy: block
          # Do NOT add attacker.example here — that would forward DNS for the C2 hostname.
          allowed-ip-endpoints: |
            # Optional extra egress pins (already included in DEFAULT_IP_ALLOWLIST in policy):
            140.82.112.21
            20.209.113.193
            140.82.116.4

      # DELIBERATELY VULNERABLE: checking out the PR's *head* commit
      # under pull_request_target means we'll execute whatever code is
      # in the fork.
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request_target'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      # Manual dispatch: emulate PR head Checkout from attacker fork.
      - uses: actions/checkout@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          repository: ${{ github.event.inputs.pr_fork_repository }}
          ref: ${{ github.event.inputs.pr_head_ref }}
          persist-credentials: false

      - name: Build
        env:
          SECRET_TOKEN: ${{ secrets.SECRET_TOKEN }}
        run: |
          chmod +x ./build.sh
          ./build.sh
      # NOTE: no explicit cleanup step needed. The Citadel action above
      # is a Node 20 action with a `post:` hook that runs at job
      # teardown (regardless of build success/failure), writes the alert
      # summary, and stops the daemons.
