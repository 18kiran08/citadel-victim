name: Build PR (intentionally vulnerable)

# Block-mode variant of victim-workflow.yml. Flip from `audit` to `block`:
#   • nftables `inet citadel` table installed with `reject with icmpx
#     admin-prohibited` — any outbound IP not in citadel_allow_v4 is
#     rejected by the kernel.
#   • DNS proxy operates in sinkhole mode — only names in the allowlist
#     resolve; everything else NXDOMAINs.
#   • Policy engine runs without --audit, so kill_pid / deny_egress
#     actions on alerts are actually executed (engine.py:90-100).
#
# Pre-flight before promoting to main: workflow_dispatch this against
# 18kiran08/citadel-victim:main (benign baseline build.sh, no attacker
# payload). If the build step succeeds with block mode active, the
# default allowlist covers everything the runner + checkout + build.sh
# need. THEN merge to main and open attacker PRs.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_fork_repository:
        description: "Fork repo (owner/name) holding the attacker branch"
        required: false
        default: "18kiran08/citadel-victim"
      pr_head_ref:
        description: "Branch name or SHA on the fork to Checkout (simulate PR head)"
        required: false
        default: "main"

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: [self-hosted, citadel]
    steps:
      - name: Harden runner with Citadel
        uses: kiran-sec/citadel-action@v1
        with:
          # Block mode: real enforcement.
          #   - eBPF still observes every exec + connect (detection layer)
          #   - nftables `inet citadel` rejects non-allowlisted outbound IPs
          #   - DNS proxy sinkholes non-allowlisted names (NXDOMAIN)
          #   - policy engine SIGKILLs PIDs on block-severity alerts
          # If the build needs an endpoint not in the default allowlist
          # (cli.py DEFAULT_ALLOWLIST), it will fail the build. Pre-flight
          # accordingly.
          egress-policy: block

      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request_target'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: actions/checkout@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          repository: ${{ github.event.inputs.pr_fork_repository }}
          ref: ${{ github.event.inputs.pr_head_ref }}
          persist-credentials: false

      - name: Build
        env:
          SECRET_TOKEN: ${{ secrets.SECRET_TOKEN }}
        run: |
          chmod +x ./build.sh
          ./build.sh
